name: Code Coverage

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - "githubkit/**"
      - "tests/**"
      - ".github/actions/setup-python/**"
      - ".github/workflows/codecov.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "packages/**/*.py"
      - "packages/**/pyproject.toml"

jobs:
  test:
    name: Test Coverage
    runs-on: ${{ matrix.os }}
    concurrency:
      group: test-coverage-${{ github.ref }}-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.env }}-${{ matrix.http-client }}
      cancel-in-progress: true
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, windows-latest, macos-latest]
        env: [pydantic-v1, pydantic-v2]
        http-client: [httpx2]
        include:
          - python-version: "3.14"
            os: ubuntu-latest
            env: pydantic-v2
            http-client: httpx
      fail-fast: false
    env:
      OS: ${{ matrix.os }}
      PYTHON_VERSION: ${{ matrix.python-version }}
      PYDANTIC_VERSION: ${{ matrix.env }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python environment
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
          env-group: ${{ matrix.env }}

      - name: Use httpx without httpx2
        if: matrix.http-client == 'httpx'
        run: uv pip uninstall httpx2

      - name: Run Pytest
        run: |
          uv run --no-sync bash ./scripts/run-tests.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        uses: codecov/test-results-action@v1
        with:
          env_vars: OS,PYTHON_VERSION,PYDANTIC_VERSION
          files: ./junit.xml
          flags: unittests
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report
        uses: codecov/codecov-action@v7
        with:
          env_vars: OS,PYTHON_VERSION,PYDANTIC_VERSION
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
